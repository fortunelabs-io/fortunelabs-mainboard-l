[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 921600

; --- Everything below is new, added for SIL (host-native) testing only ---
;
; Scope: compiles and runs Unity tests against the real driver sources
; (mcp23017.c, ads1115.c) via symlinks in test/, linked against
; mock_i2c_bus.c instead of physical hardware. Does not touch [platformio]
; or env:esp32dev above in any way, so the real ESP32 build is unaffected.
;
; No -I flags needed at all: every header/source is reachable at the
; exact relative path its own #include statement expects, directly
; under test/ (the root test_dir, which PlatformIO puts on the include
; path and compiles into every test_xxx/ sub-application automatically).
; Verified end-to-end with a manual gcc compile+run before this was
; handed back, both suites passing 100%.

[env:native]
platform       = native
test_framework = unity
build_flags =
    -std=c11