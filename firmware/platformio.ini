[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 921600

; --- Everything below is new, added for SIL (host-native) testing only ---
;
; Scope: compiles and runs Unity tests against the real driver sources
; (mcp23017.c, ads1115.c) via symlinks in test/, linked against
; mock_i2c_bus.c instead of physical hardware. Does not touch [platformio]
; or env:esp32dev above in any way, so the real ESP32 build is unaffected.
;
; No src_dir override and no build_src_filter needed: the symlinked
; driver .c/.h files sit directly in test/ (the root test_dir), which
; PlatformIO automatically compiles into every test_xxx/ sub-application
; and adds to the include search path. See the ln -s commands provided
; alongside this file for the symlinks this env depends on.

[env:native]
platform       = native
test_framework = unity
build_flags =
    -std=c11
    -Itest/stubs