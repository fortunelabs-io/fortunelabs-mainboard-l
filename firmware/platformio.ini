[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 921600

; HIL Trace Build Flags
[env:esp32dev_trace]
extends = env:esp32dev
build_flags = -DFL_TRACE_ENABLED

; SIL
[env:native]
platform       = native
test_framework = unity
build_flags =
    -std=c11